<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Viagem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .radio-group {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .radio-group input {
            margin-right: 8px;
            transform: scale(1.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Formulário de Viagem</h2>
        <form id="meuFormulario" onsubmit="enviarParaPlanilha(event)">

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" placeholder="Digite seu sobrenome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="sindicato">Sindicato:</label>
                <input type="text" id="sindicato" placeholder="Nome do sindicato">
            </div>

            <div class="radio-group">
                <label>Tipo de Viagem:</label>
                <label>
                    <input type="radio" name="tipo_viagem" value="Viagem na planta" required> Viagem na planta
                </label>
                <label>
                    <input type="radio" name="tipo_viagem" value="Método tradicional até 12x"> Método tradicional até
                    12x
                </label>
            </div>

            <button type="submit" id="btnEnviar">Enviar Formulário</button>
            <div id="loading">Enviando dados...</div>
        </form>
    </div>

    <script>
        function enviarParaPlanilha(event) {
            event.preventDefault();

            const urlDoScript = "https://script.google.com/macros/s/AKfycbxXAwbVKeBcJhzgFGqDGuXxbfqqPr0lHafFBAlcqlGIRZBzGvbRky8oOdRd5sC_E1Rm/exec";

            const btnEnviar = document.getElementById('btnEnviar');
            const loading = document.getElementById('loading');

            // Desativa o botão e mostra o carregando
            btnEnviar.disabled = true;
            loading.style.display = 'block';

            const dados = {
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                email: document.getElementById('email').value,
                sindicato: document.getElementById('sindicato').value,
                tipo_viagem: document.querySelector('input[name="tipo_viagem"]:checked').value
            };

            // Enviando os dados via Fetch API para o Google Sheets
            fetch(urlDoScript, {
                method: 'POST',
                mode: 'no-cors', // Necessário para requisições externas do Google Apps Script
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dados)
            })
                .then(() => {
                    alert("Formulário enviado e salvo na planilha com sucesso!");
                    document.getElementById('meuFormulario').reset();
                })
                .catch((error) => {
                    console.error('Erro:', error);
                    alert("Ocorreu um erro ao enviar o formulário.");
                })
                .finally(() => {
                    btnEnviar.disabled = false;
                    loading.style.display = 'none';
                });
        }
    </script>

</body>

</html>
